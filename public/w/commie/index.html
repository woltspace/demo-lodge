<div class="modal-backdrop ds-dialog-backdrop" id="create-modal" onclick="if(event.target===this)closeCreateWolt()">
  <section class="modal ds-dialog" role="dialog" aria-modal="true" aria-labelledby="create-modal-title" aria-describedby="create-modal-description">
    <header class="modal-header ds-dialog-header">
      <div>
        <h2 class="modal-title" id="create-modal-title">Create a wolt</h2>
        <p class="ds-dialog-description" id="create-modal-description">Start with a name, then choose how this wolt works.</p>
      </div>
      <button type="button" class="modal-close" onclick="closeCreateWolt()" aria-label="Close Create a wolt">&times;</button>
    </header>
    
    <div class="modal-body">
      <div class="modal-field create-name-field">
        <label class="modal-label" for="create-name">Wolt name</label>
        <input type="text" class="modal-input" id="create-name" placeholder="Wolter White" maxlength="40" autocomplete="off" spellcheck="false" oninput="updateCreatePreview()">
        <p class="create-name-warning" id="create-name-warning" role="alert" hidden></p>
      </div>
      <div class="modal-field">
        <label class="modal-label" for="create-harness">Harness <span class="modal-label-hint">(you can change it later in Settings)</span></label>
        <select class="modal-input" id="create-harness" onchange="selectCreateHarness(this.value)"></select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Working style</label>
        <div class="type-grid">
          <div class="type-card" data-type="otter" onclick="pickType(this)">
            <div class="type-card-emoji">🦦</div>
            <div class="type-card-name">Otter</div>
            <div class="type-card-hint" data-pace="Quick">Quick</div>
            <div class="type-card-model"></div>
            <select class="type-card-select" aria-label="Model" hidden></select>
          </div>
          <div class="type-card" data-type="beaver" onclick="pickType(this)">
            <div class="type-card-emoji">🦫</div>
            <div class="type-card-name">Beaver</div>
            <div class="type-card-hint" data-pace="Builder">Builder</div>
            <div class="type-card-model"></div>
            <select class="type-card-select" aria-label="Model" hidden></select>
          </div>
          <div class="type-card" data-type="raccoon" onclick="pickType(this)">
            <div class="type-card-emoji">🦝</div>
            <div class="type-card-name">Raccoon</div>
            <div class="type-card-hint" data-pace="Thinker">Thinker</div>
            <div class="type-card-model"></div>
            <select class="type-card-select" aria-label="Model" hidden></select>
          </div>
        </div>
      </div>
      <div class="modal-error" id="create-error"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" onclick="closeCreateWolt()">Cancel</button>
      <button type="button" class="btn btn-primary" id="create-submit" onclick="submitCreateWolt()">Create</button>
    </div>

  </section>
